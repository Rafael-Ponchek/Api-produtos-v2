<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Produtos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>Registro</h1>
        <form id="Registro-cliente">
            <label>Nome</label>
            <input type="text" id="registroNome">
            <label>E-mail:</label>
            <input type="email" id="loginEmail">
            <label>Senha:</label>
            <input type="password" id="loginSenha">
            <select id="tipo-acesso" name="tipo_acesso" required>
                <option value="" disabled selected>Escolha um prefil</option>
                <option value="administrador">Administrador</option>
                <option value="cliente">Cliente</option>
            </select>
            <button onclick="botaoLoguin">Entrar</button>
            
        </form>
    </div>
    <script src="script.js"></script>

</body>
