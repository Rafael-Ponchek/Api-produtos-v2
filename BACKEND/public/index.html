<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Produtos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Cadastro de Produtos</h1>
    <p id="usuario-logado"></p>
    <button id="sair" type="button">Sair</button>

    <div id="area-admin">
        <form id="produto-form">
            <label>Nome:</label>
            <input type="text" id="nome" required>

            <label>Preço:</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>

            <label>Quantidade:</label>
            <input type="number" id="quantidade" min="1" step="1" required>

            <button type="submit">Adicionar produto</button>
        </form>
        <button id="limpar-tabela" type="button">Limpar tabela</button>
    </div>

    <p id="aviso-acesso"></p>
    <h3 id="total-estoque">Total em estoque: R$ 0.00</h3>

    <table id="tabela-produtos">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th>Total item</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
